<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<title>You're offline</title>
<style>
  html,body{margin:0;height:100%;background:#fbf8f2;color:#2f2a24;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem calc(1.5rem + env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left))}
  img{width:96px;height:96px;border-radius:24px}
  h1{font-family:Georgia,serif;font-weight:400;font-size:2rem;margin:1.5rem 0 .5rem}
  p{color:#6f665b;max-width:22rem;line-height:1.5}
  button{margin-top:1.5rem;border:0;border-radius:999px;background:#2f2a24;color:#fbf8f2;padding:1rem 2rem;font-size:1rem}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Bookings and availability need a connection so they're always up to date. Please reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
